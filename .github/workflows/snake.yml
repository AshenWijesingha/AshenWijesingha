# =============================================================================
#  CONTRIBUTION SNAKE — SETUP CHECKLIST
#
#  If the snake is not showing, it is almost always one of these five things.
#  Work through them in order:
#
#  1. PATH. This file must be committed to EXACTLY this path in the repo
#     AshenWijesingha/AshenWijesingha:
#
#         .github/workflows/snake.yml
#
#     Uploading it to the repo root as "snake.yaml" does nothing — GitHub only
#     reads workflow files from the .github/workflows/ folder. The extension
#     .yml and .yaml both work, but the folder is not optional.
#
#  2. DEFAULT BRANCH. The file must be on your default branch (main) for the
#     "Run workflow" button to appear in the Actions tab.
#
#  3. PERMISSIONS. Repo Settings > Actions > General > Workflow permissions
#     must be set to "Read and write permissions". Without this, the push to
#     the output branch fails with a 403 and the job goes red.
#
#  4. FIRST RUN. A schedule never fires on the first commit. Go to the Actions
#     tab > "Generate Contribution Snake" > "Run workflow" > Run. Wait ~1 min.
#
#  5. VERIFY. After a green run, this URL must show an SVG in your browser:
#     https://github.com/AshenWijesingha/AshenWijesingha/tree/output
#     The filenames there must match the ones in the README exactly
#     (github-snake.svg and github-snake-dark.svg).
#
#  Note: GitHub disables scheduled workflows after 60 days of repo inactivity.
#  Re-enable from the Actions tab if the snake ever freezes.
# =============================================================================

name: Generate Contribution Snake

on:
  # Refresh twice a day
  schedule:
    - cron: "0 */12 * * *"

  # Lets you trigger it by hand from the Actions tab — use this for the first run
  workflow_dispatch:

  # Also regenerate whenever you push to the default branch
  push:
    branches:
      - main
      - master

# Required so the job can push the generated SVGs to the output branch
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Show what was generated
        run: ls -lh dist

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
